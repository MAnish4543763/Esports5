<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================================
         DOCUMENT SETUP
    ========================================================== -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Manifest Esports - Tournament management and esports operations.">

    <title>Manifest Esports</title>


    <!-- =========================================================
         CSS
    ========================================================== -->

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


    <!-- =========================================================
         MODULE 1
         NAVIGATION BAR
    ========================================================== -->

    <header class="main-navbar" id="mainNavbar">


        <!-- =====================================================
             LEFT SIDE
             LOGO
             
             On mobile:
             Width = 20% of navbar
             Height = 100% of navbar
        ====================================================== -->

        <div class="navbar-logo">

            <div class="logo-mark">

                <img
                    src="mainlogo.png"
                    alt="Manifest Esports"
                >

            </div>

        </div>



        <!-- =====================================================
             RIGHT SIDE
             LOGIN + SIGN UP + HAMBURGER
        ====================================================== -->

        <div class="navbar-right">


            <!-- =================================================
                 LOGIN / SIGN UP
            ================================================== -->

            <div class="navbar-auth" id="navbarAuth">

                <a
                    href="login.html"
                    class="navbar-login"
                >
                    LOGIN
                </a>


                <a
                    href="signup.html"
                    class="navbar-signup"
                >
                    SIGN UP
                </a>

            </div>



            <!-- =================================================
                 PROFILE
                 
                 Hidden by default.
                 Can be activated later through JavaScript.
            ================================================== -->

            <div
                class="navbar-profile"
                id="navbarProfile"
            >

                <button
                    class="profile-button"
                    id="profileButton"
                    aria-label="Open Profile"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 12a4 4 0 1 0 0-8
                               4 4 0 0 0 0 8ZM4 21
                               c0-4.42 3.58-8 8-8s8
                               3.58 8 8H4Z"
                        />

                    </svg>

                </button>


                <!-- PROFILE DROPDOWN -->

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <div class="profile-dropdown-label">
                        ACCOUNT
                    </div>

                    <div
                        class="profile-dropdown-name"
                        id="profileName"
                    >
                        PROFILE
                    </div>

                    <div class="profile-dropdown-line"></div>

                    <a
                        href="profile.html"
                        class="profile-dropdown-link"
                    >
                        VIEW PROFILE
                    </a>

                    <a
                        href="settings.html"
                        class="profile-dropdown-link"
                    >
                        ACCOUNT SETTINGS
                    </a>

                    <button
                        class="profile-logout"
                        id="logoutButton"
                    >
                        LOG OUT
                    </button>

                </div>

            </div>



            <!-- =================================================
                 HAMBURGER MENU
                 
                 THIS IS THE ONLY HAMBURGER BUTTON.
            ================================================== -->

            <button
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open Menu"
                aria-expanded="false"
                type="button"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>

    </header>



    <!-- =========================================================
         MODULE 2
         MENU OVERLAY
    ========================================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>



    <!-- =========================================================
         MODULE 3
         SIDE MENU
    ========================================================== -->

    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
    >

        <div class="side-menu-content">


            <!-- MENU TITLE -->

            <div class="menu-heading">
                MENU
            </div>

            <div class="menu-line"></div>



            <!-- AUTHENTICATION AREA -->

            <div
                class="menu-auth-container"
                id="menuAuthContainer"
            >

                <div class="menu-auth-buttons">

                    <a
                        href="login.html"
                        class="menu-login-button"
                    >
                        LOGIN
                    </a>

                    <a
                        href="signup.html"
                        class="menu-signup-button"
                    >
                        SIGN UP
                    </a>

                </div>

            </div>



            <!-- PROFILE AREA -->

            <div
                class="menu-profile"
                id="menuProfile"
            >

                <div class="menu-profile-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 12a4 4 0 1 0 0-8
                               4 4 0 0 0 0 8ZM4 21
                               c0-4.42 3.58-8 8-8s8
                               3.58 8 8H4Z"
                        />

                    </svg>

                </div>


                <div class="menu-profile-info">

                    <div class="menu-profile-label">
                        PROFILE
                    </div>

                    <div class="menu-profile-name">
                        GUEST
                    </div>

                </div>

            </div>



            <!-- =================================================
                 NAVIGATION LINKS
            ================================================== -->

            <nav class="menu-navigation">

                <a href="#home">
                    HOME
                </a>

                <a href="#tournaments">
                    TOURNAMENTS
                </a>

                <a href="#teams">
                    TEAMS
                </a>

                <a href="#leaderboard">
                    LEADERBOARD
                </a>

                <a href="#esports-connect">
                    ESPORTS CONNECT
                </a>

                <a href="#news">
                    NEWS
                </a>

                <a href="#about">
                    ABOUT US
                </a>

            </nav>

        </div>

    </aside>



    <!-- =========================================================
         MODULE 4
         MAIN WEBSITE CONTENT
         
         Keep your existing sections here.
    ========================================================== -->

    <main>


        <!-- HOME -->

        <section
            id="home"
            class="placeholder-section"
        >

            <!-- Your Home content goes here -->

        </section>



        <!-- TOURNAMENTS -->

        <section
            id="tournaments"
            class="placeholder-section"
        >

            <!-- Your Tournaments content goes here -->

        </section>



        <!-- TEAMS -->

        <section
            id="teams"
            class="placeholder-section"
        >

            <!-- Your Teams content goes here -->

        </section>



        <!-- LEADERBOARD -->

        <section
            id="leaderboard"
            class="placeholder-section"
        >

            <!-- Your Leaderboard content goes here -->

        </section>



        <!-- ESPORTS CONNECT -->

        <section
            id="esports-connect"
            class="placeholder-section"
        >

            <!-- Your Esports Connect content goes here -->

        </section>



        <!-- NEWS -->

        <section
            id="news"
            class="placeholder-section"
        >

            <!-- Your News content goes here -->

        </section>



        <!-- ABOUT -->

        <section
            id="about"
            class="placeholder-section"
        >

            <!-- Your About content goes here -->

        </section>

    </main>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="js/script.js"></script>

</body>

</html>
