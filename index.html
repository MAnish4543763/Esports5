<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================================================
         DOCUMENT SETUP
    ========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Manifest Esports - Tournament management and esports operations."
    >

    <title>Manifest Esports</title>


    <!-- =========================================================
         MAIN CSS
    ========================================================== -->

    <link rel="stylesheet" href="css/styles.css">

</head>


<body>


    <!-- =========================================================
         MODULE 1
         MAIN NAVIGATION BAR
    ========================================================== -->

    <header class="main-navbar">


        <!-- =====================================================
             LEFT SECTION — LOGO

             This section is completely independent from the
             buttons on the right.

             Mobile:
             20% of navbar width

             Desktop:
             20% of navbar width
        ====================================================== -->

        <div class="navbar-logo-section">

            <div class="navbar-logo">

                <img
                    src="mainlogo.png"
                    alt="Manifest Esports"
                >

            </div>

        </div>



        <!-- =====================================================
             RIGHT SECTION

             Contains:

             - Login
             - Sign Up
             OR
             - Profile
             - Hamburger
        ====================================================== -->

        <div class="navbar-right-section">


            <!-- =================================================
                 LOGGED OUT AUTH BUTTONS
            ================================================== -->

            <div
                class="navbar-auth"
                id="navbarAuth"
            >

                <a
                    href="login.html"
                    class="navbar-login"
                >
                    LOGIN
                </a>


                <a
                    href="signup.html"
                    class="navbar-signup"
                >
                    SIGN UP
                </a>

            </div>



            <!-- =================================================
                 LOGGED IN PROFILE

                 Hidden before login.
                 Appears after login.
            ================================================== -->

            <div
                class="navbar-profile"
                id="navbarProfile"
            >

                <button
                    class="profile-button"
                    id="profileButton"
                    type="button"
                    aria-label="Open Profile"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 12a4 4 0 1 0 0-8
                               4 4 0 0 0 0 8ZM4 21
                               c0-4.42 3.58-8 8-8s8
                               3.58 8 8H4Z"
                        />

                    </svg>

                </button>


                <!-- PROFILE DROPDOWN -->

                <div
                    class="profile-dropdown"
                    id="profileDropdown"
                >

                    <div class="profile-dropdown-label">
                        TEAM
                    </div>


                    <div
                        class="profile-dropdown-name"
                        id="profileTeamName"
                    >
                        GUEST
                    </div>


                    <div class="profile-dropdown-line"></div>


                    <a
                        href="profile.html"
                        class="profile-dropdown-link"
                    >
                        VIEW PROFILE
                    </a>


                    <a
                        href="settings.html"
                        class="profile-dropdown-link"
                    >
                        ACCOUNT SETTINGS
                    </a>


                    <button
                        class="profile-logout"
                        id="logoutButton"
                        type="button"
                    >
                        LOG OUT
                    </button>

                </div>

            </div>



            <!-- =================================================
                 ONE AND ONLY HAMBURGER
            ================================================== -->

            <button
                class="menu-toggle"
                id="menuToggle"
                type="button"
                aria-label="Open Menu"
                aria-expanded="false"
            >

                <span></span>
                <span></span>
                <span></span>

            </button>

        </div>

    </header>



    <!-- =========================================================
         MODULE 2
         DARK OVERLAY
    ========================================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>



    <!-- =========================================================
         MODULE 3
         SIDE MENU
    ========================================================== -->

    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
    >

        <div class="side-menu-content">


            <!-- =================================================
                 MENU TITLE
            ================================================== -->

            <div class="menu-heading">
                MENU
            </div>

            <div class="menu-line"></div>



            <!-- =================================================
                 PROFILE

                 IMPORTANT:
                 PROFILE IS ABOVE LOGIN/SIGN UP
            ================================================== -->

            <div class="side-profile">

                <a
                    href="profile.html"
                    class="side-profile-button"
                    aria-label="Open Profile"
                >

                    <div class="side-profile-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M12 12a4 4 0 1 0 0-8
                                   4 4 0 0 0 0 8ZM4 21
                                   c0-4.42 3.58-8 8-8s8
                                   3.58 8 8H4Z"
                            />

                        </svg>

                    </div>

                </a>


                <div class="side-profile-info">

                    <div class="side-profile-label">
                        PROFILE
                    </div>

                    <div
                        class="side-profile-name"
                        id="sideProfileName"
                    >
                        GUEST
                    </div>

                </div>

            </div>



            <!-- =================================================
                 LOGGED OUT:

                 LOGIN + SIGN UP

                 LOGGED IN:

                 TEAM NAME
            ================================================== -->

            <div
                class="menu-auth-container"
                id="menuAuthContainer"
            >

                <!-- =============================================
                     LOGGED OUT BUTTONS
                ============================================== -->

                <div
                    class="menu-auth-buttons"
                    id="menuAuthButtons"
                >

                    <a
                        href="login.html"
                        class="menu-login-button"
                    >
                        LOGIN
                    </a>


                    <a
                        href="signup.html"
                        class="menu-signup-button"
                    >
                        SIGN UP
                    </a>

                </div>


                <!-- =============================================
                     LOGGED IN TEAM

                     Hidden until user logs in.
                ============================================== -->

                <div
                    class="menu-team-container"
                    id="menuTeamContainer"
                >

                    <div class="menu-team-label">
                        TEAM
                    </div>


                    <div
                        class="menu-team-name"
                        id="menuTeamName"
                    >
                        TEAM NAME
                    </div>

                </div>

            </div>



            <!-- =================================================
                 NAVIGATION
            ================================================== -->

            <nav class="menu-navigation">

                <a href="#home">
                    HOME
                </a>

                <a href="#tournaments">
                    TOURNAMENTS
                </a>

                <a href="#teams">
                    TEAMS
                </a>

                <a href="#leaderboard">
                    LEADERBOARD
                </a>

                <a href="#esports-connect">
                    ESPORTS CONNECT
                </a>

                <a href="#news">
                    NEWS
                </a>

                <a href="#about">
                    ABOUT US
                </a>

            </nav>

        </div>

    </aside>



    <!-- =========================================================
         MAIN WEBSITE CONTENT

         Replace these sections with your actual modules later.
    ========================================================== -->

    <main>

        <section
            id="home"
            class="placeholder-section"
        ></section>


        <section
            id="tournaments"
            class="placeholder-section"
        ></section>


        <section
            id="teams"
            class="placeholder-section"
        ></section>


        <section
            id="leaderboard"
            class="placeholder-section"
        ></section>


        <section
            id="esports-connect"
            class="placeholder-section"
        ></section>


        <section
            id="news"
            class="placeholder-section"
        ></section>


        <section
            id="about"
            class="placeholder-section"
        ></section>

    </main>



    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script src="js/script.js"></script>

</body>

</html>
